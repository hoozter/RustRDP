[package]
name = "rustrdp"
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"
description = "A polished Linux connection manager for FreeRDP"
publish = false
readme = "README.md"
keywords = ["rdp", "freerdp", "remote-desktop", "wayland", "kde"]
categories = ["gui", "network-programming"]

[dependencies]
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui_extras = { version = "0.35", default-features = false, features = ["svg"] }
keyring = "4.1.6"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
